[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "townlight-permitting"
version = "0.3.0+dev.2"
description = "Townlight Permitting runtime foundation for permit pre-application and development-review intake support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Townlight contributors" }
]
dependencies = [
  "alembic>=1.13.0,<2.0.0",
  "townlight-core==1.3.0.dev2",
  "fastapi>=0.115.0,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "PyMuPDF>=1.24,<2",
  "build>=1.2.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["townlight_permitting"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
  "townlight_permitting",
  "scripts",
  "tests",
  "README.md",
  "README.txt",
  "CHANGELOG.md",
  "USER-MANUAL.md",
  "USER-MANUAL.txt",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "SUPPORT.md",
  "CODE_OF_CONDUCT.md",
  "AGENTS.md",
  ".github",
  "docs",
  "MILESTONE_0_7_DONE.md",
  "PRODUCTION_DEPTH_INTAKE_PERSISTENCE_DONE.md",
  "LICENSE-CODE",
  "LICENSE-DOCS",
]

[tool.ruff]
target-version = "py311"
line-length = 100


